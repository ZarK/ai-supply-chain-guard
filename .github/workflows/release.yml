name: Release Skill

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${INPUT_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must use SemVer format like v1.0.0 or v1.0.0-rc.1"
            exit 1
          fi

          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tags must point to a commit reachable from origin/main"
            exit 1
          fi

          if grep -q '^version:' supply-chain-guard/SKILL.md; then
            echo "::error file=supply-chain-guard/SKILL.md,line=4::Do not store release versions in SKILL.md; Git tags are the source of truth."
            exit 1
          fi

          test -f supply-chain-guard/SKILL.md
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Package skill
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          archive="supply-chain-guard-${tag}.tar.gz"
          tar --sort=name --owner=0 --group=0 --numeric-owner -czf "${archive}" supply-chain-guard
          sha256sum "${archive}" > "${archive}.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          archive="supply-chain-guard-${tag}.tar.gz"
          gh release create "${tag}" \
            "${archive}" \
            "${archive}.sha256" \
            --verify-tag \
            --title "${tag}" \
            --notes "Release ${tag} of the AI Supply Chain Guard skill. The installable artifact is ${archive}; verify it with ${archive}.sha256."
