name: Release Skill

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v1.0.0"
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          source .github/scripts/changelog.sh
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${INPUT_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          validate_release_tag "$tag"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$tag^{commit}")"

          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tags must point to a commit reachable from origin/main"
            exit 1
          fi

          if grep -q '^version:' supply-chain-guard/SKILL.md; then
            echo "::error file=supply-chain-guard/SKILL.md,line=4::Do not store release versions in SKILL.md; Git tags are the source of truth."
            exit 1
          fi

          test -f supply-chain-guard/SKILL.md
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Read release notes at the tag
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          source .github/scripts/changelog.sh
          git show "refs/tags/$TAG:CHANGELOG.md" > "$RUNNER_TEMP/release-changelog.md"
          release_notes "$RUNNER_TEMP/release-changelog.md" "$TAG" > "$RUNNER_TEMP/release-notes.md"
          archive="supply-chain-guard-${TAG}.tar.gz"
          printf '\nThe installable artifact is `%s`; verify it with `%s.sha256`.\n' \
            "$archive" "$archive" >> "$RUNNER_TEMP/release-notes.md"

      - name: Package skill
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          archive="supply-chain-guard-${TAG}.tar.gz"
          tar --sort=name --owner=0 --group=0 --numeric-owner -czf "${archive}" supply-chain-guard
          sha256sum "${archive}" > "${archive}.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          archive="supply-chain-guard-${TAG}.tar.gz"
          gh release create "${TAG}" \
            "${archive}" \
            "${archive}.sha256" \
            --verify-tag \
            --title "${TAG}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
