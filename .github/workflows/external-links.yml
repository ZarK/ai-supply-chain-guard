name: Check External Markdown Links

on:
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check external Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --scheme http
            --scheme https
            --include-fragments
            --max-retries 2
            --timeout 20
            --exclude 'https://socket\.dev/.*'
            --verbose
            --no-progress
            "**/*.md"
          fail: true
          failIfEmpty: true
          format: markdown
          jobSummary: true
          lycheeVersion: v0.23.0
          output: lychee/external-links.md
