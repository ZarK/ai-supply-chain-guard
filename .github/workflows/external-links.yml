name: Check External Markdown Links

on:
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Check external Markdown links
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: >-
            --scheme http
            --scheme https
            --include-fragments
            --max-retries 2
            --timeout 20
            --exclude 'https://socket\.dev/.*'
            --verbose
            --no-progress
            "**/*.md"
          fail: true
          failIfEmpty: true
          format: markdown
          jobSummary: true
          lycheeVersion: v0.23.0
          output: lychee/external-links.md
